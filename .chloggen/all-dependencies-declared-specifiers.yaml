# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'.
change_type: bug_fix

# A single word describing the area of concern (e.g. distro, pyproto, exporter,
# resource-detectors, deps, ci, release, docs).
component: distro

# A brief description of the change. Surround your text with quotes ("") if it
# needs to start with a backtick (`).
note: Generate all-dependencies.txt from what upstream declares, not from the installed versions

# One or more tracking issues related to the change. At least one is required.
issues: [48]

# (Optional) One or more lines of additional information to render under the
# primary note. These lines are padded with 2 spaces and inserted directly into
# the document. Use pipe (|) for multiline entries.
subtext: |
  The injector bootstrap stands the whole distribution down when any line of
  ``all-dependencies.txt`` is violated by the application. Consumers generated
  that file as one exact pin per installed package, so an application carrying
  ``wrapt`` 1.16 lost all telemetry even though
  ``opentelemetry-instrumentation`` declares ``<3.0.0,>=1.0.0``. The same held
  for ``asgiref``, ``packaging``, ``psutil`` and ``typing-extensions``, each of
  them common in applications.

  ``scripts/generate_all_dependencies.py`` now owns the format. A line carries
  the conjunction of what the upstream packages of the tree declare about that
  package. The distribution's own pins are skipped: they record the set a
  release was validated against, rather than what the code supports. A package
  that only the distribution depends on comes out unconstrained, which is what
  finally makes the ``UNPINNED_BY_DESIGN`` table of
  ``scripts/check_pinned_dependencies.py`` reach the bootstrap.

  Nothing in the bootstrap changed. It already evaluated whatever specifier it
  was handed.

change_logs: [user]
