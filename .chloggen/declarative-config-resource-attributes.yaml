note: Keep the distribution's resource attributes when declarative configuration is active

# One or more tracking issues related to the change. At least one is required.
issues: [6]

# (Optional) One or more lines of additional information to render under the
# primary note. These lines are padded with 2 spaces and inserted directly into
# the document. Use pipe (|) for multiline entries.
subtext: |
  The distribution writes its detected resource attributes into
  ``OTEL_RESOURCE_ATTRIBUTES`` and ``OTEL_SERVICE_NAME``, which the declarative
  resource builder deliberately ignores. Setting ``OTEL_CONFIG_FILE`` therefore
  dropped ``telemetry.distro.name``, ``telemetry.distro.version``,
  ``k8s.pod.uid`` and the entrypoint-derived ``service.name`` fallback from the
  exported resource, with no error to say so.

  Registering the detectors under the ``opentelemetry_resource_detector``
  entry-point group is not enough on its own, because declarative configuration
  runs only the detectors a config file lists. ``Dash0Configurator`` now loads
  the config file itself, adds the missing ``dash0_*`` detectors to the parsed
  configuration, and hands it to ``configure_sdk``, so the attributes survive
  without any change to the user's YAML. Attributes declared in the file still
  take precedence over detected ones, and detectors already listed there are
  not added twice.

