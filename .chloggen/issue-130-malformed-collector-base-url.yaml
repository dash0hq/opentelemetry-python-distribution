change_type: bug_fix

component: distro

note: Disable the distribution with one warning when the collector endpoint cannot be parsed, instead of raising out of auto-instrumentation

issues: [130, 153]

subtext: |
  A value ``urlparse`` rejects, such as the IPv6 literal
  ``http://[::1:4318`` with its closing bracket missing, raised
  ``ValueError: Invalid IPv6 URL`` while the distribution configured itself.
  That happened before the instrumentors were loaded, so the process reported
  nothing at all, and an injected process deactivated the distribution on top
  of it.

  A port that is not a number, as in ``http://collector:notaport``, cost the
  same outage one step later: ``urlparse`` accepts the value and only reading
  the port raises, so the exporter raised while the configurators loaded, again
  before the instrumentors. The gate now reads the port too.

  Such a value is now treated the same way as an unset
  ``DASH0_OTEL_COLLECTOR_BASE_URL``: the SDK is turned off, a warning names the
  variable and the parse error, and startup continues.

  The value checked is the endpoint the SDK exports to, which is
  ``OTEL_EXPORTER_OTLP_ENDPOINT`` when it is set and
  ``DASH0_OTEL_COLLECTOR_BASE_URL`` otherwise. A base URL that cannot be parsed
  therefore changes nothing when ``OTEL_EXPORTER_OTLP_ENDPOINT`` overrides it
  with a value that can.

