change_type: bug_fix

component: exporter

note: Retry an OTLP/HTTP export when the network failure arrives after the request body was sent

issues: [131]

subtext: |
  The OTLP/HTTP span, log record and metric exporters caught ``URLError``
  only. CPython wraps the send phase of ``urlopen`` into ``URLError``, but
  whatever ``getresponse()`` raises propagates unwrapped, so ``TimeoutError``,
  ``http.client.RemoteDisconnected``, ``ConnectionResetError`` and
  ``http.client.BadStatusLine`` escaped ``export()`` and skipped the whole
  six-attempt retry budget. The batch was dropped after a single POST.

  A connection refused does arrive as ``URLError`` and was retried correctly,
  which is why the exporters looked healthy against a collector that was
  simply not listening. The failures that bypassed the retries are the ones a
  collector produces while it is under load, restarting or being drained, and
  the ones a firewall or a proxy produces mid-request.

  The classification now covers ``OSError`` and ``http.client.HTTPException``,
  which together hold every transport failure
  ``requests.exceptions.RequestException`` covered before the exporters were
  rewritten onto ``urllib``. One of them is excluded from the retries:
  ``http.client.InvalidURL``, raised when the configured endpoint carries
  something like a non-numeric port, is logged as an error and fails the batch
  at once rather than spending the export deadline on an endpoint that cannot
  become valid.

  A read timeout is the one failure that still sends a single POST. The first
  attempt is given the whole remaining deadline, so a collector that accepts
  the body and never answers consumes it before a retry becomes possible. What
  changes there is that ``export`` returns FAILURE and records the error
  instead of raising through the SDK.

  An export attempt is no longer started once the deadline has passed, which
  happens when a backoff sleep returns later than the time it was given. Such
  an attempt used to open a connection with a zero timeout, fail with
  ``BlockingIOError``, and replace the real transport failure in the exporter's
  error telemetry with ``Operation now in progress``.

