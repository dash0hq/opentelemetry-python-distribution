change_type: bug_fix

component: resource-detectors

note: Name the application rather than the launcher when it is started with fastapi, streamlit, scrapy, airflow, uwsgi, chalice, pserve, twistd, dagster or prefect

issues: [138]

subtext: |
  The service-name detector skips a launcher, a console script that runs
  someone else's application, and reports the application instead. Ten common
  launchers were missing from that list, so ``fastapi run main.py`` reported
  ``service.name=fastapi`` and carried FastAPI's own release as
  ``service.version``. Every deployment started that way collapsed into a
  single service, and the detected name beat both the application's own
  ``pyproject.toml`` and the SDK's honest ``unknown_service:python3``.

  The entrypoint basename now drops ``.exe`` and ``.pyw`` as well as ``.py``.
  On Windows a console script is installed as ``uvicorn.exe``, which matched
  no entry in the skip list and no ``console_scripts`` entry point either, so
  the list did nothing there and ``uvicorn.exe`` was reported as the service.

  ``mlflow`` is deliberately not skipped. It runs projects and models in child
  processes, and ``mlflow server`` serves MLflow's own API, so a process named
  ``mlflow`` really is MLflow.

