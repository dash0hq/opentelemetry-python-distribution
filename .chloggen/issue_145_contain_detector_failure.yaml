# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'.
change_type: bug_fix

# A single word describing the area of concern (e.g. distro, pyproto, exporter,
# resource-detectors, deps, ci, release, docs).
component: configuration

# A brief description of the change. Surround your text with quotes ("") if it
# needs to start with a backtick (`).
note: Skip a resource detector named in a declarative configuration file that is not installed or that fails, instead of leaving the SDK unconfigured

# One or more tracking issues related to the change. At least one is required.
issues: [145]

# (Optional) One or more lines of additional information to render under the
# primary note. These lines are padded with 2 spaces and inserted directly into
# the document. Use pipe (|) for multiline entries.
subtext: |
  The resource is built before the tracer, meter and logger providers and
  before the propagator, so a detector that raised took the whole SDK with it.
  A file listing ``container`` on a host without
  ``opentelemetry-resource-detector-container`` cost the application traces,
  metrics, logs and propagation. A detector that cannot be loaded, or that
  raises inside ``detect()``, is now logged and skipped, and the detectors
  listed after it still run.

# Optional: The change log or logs in which this entry should be included.
# e.g. '[user]'. Include 'user' if the change is relevant to end users.
# Default: '[user]'
change_logs: []
