change_type: breaking

component: distro

note: Move to opentelemetry-api and opentelemetry-sdk 1.45.2 and contrib 0.66b2, which fix two ReDoS vulnerabilities in trace context parsing

issues: [118]

subtext: |
  ``opentelemetry-api`` 1.44.0 parses ``tracestate`` and ``traceparent`` with
  regular expressions that take quadratic time on crafted input
  (CVE-2026-114603, fixed in 1.45.1, and CVE-2026-126360, fixed in 1.45.2).
  ``opentelemetry-sdk`` and ``opentelemetry-semantic-conventions`` require
  ``opentelemetry-api`` at exactly their own version, so the injected
  distribution only activates in an application whose ``opentelemetry-api``
  is the one it ships.
  Until now that was 1.44.0, so an application that depends on the API for
  manual instrumentation had to keep a vulnerable version to stay
  instrumented.
  Applications that declare ``opentelemetry-api`` should move to 1.45.2.
  An application that keeps 1.44.0 now trips the dependency conflict check,
  and the distribution deactivates itself for that process.
  ``service.name`` now defaults to ``unknown_service:<executable>``, such as
  ``unknown_service:python3``, instead of ``unknown_service``, as the
  specification requires. The default comes from ``opentelemetry-sdk``, so it
  applies to declarative configuration and to the ``opentelemetry-instrument``
  path alike, and it is what a process gets whenever nothing names the service:
  no ``OTEL_SERVICE_NAME``, no ``service.name`` in
  ``OTEL_RESOURCE_ATTRIBUTES``, and a generic runner such as ``gunicorn`` that
  the Dash0 service-name detector declines to name. Anything matching the
  literal ``unknown_service`` has to match the prefix instead.
  A ``${VAR}`` reference in a configuration file that has no default and whose
  variable is unset now substitutes an empty value, which the parser reads as
  null, as the specification requires and as the Java and Node.js
  implementations already do. It used to fail the load, and under injection the
  distribution deactivated itself naming the variable. A file that relied on that
  failure now starts with the SDK default for the setting, so an
  ``otlp_http`` ``endpoint`` left null sends to
  ``http://localhost:4318/v1/traces``. Give every reference a default, as in
  ``${COLLECTOR_ENDPOINT:-http://collector:4318}``, to keep a missing variable
  from reaching that fallback.
  ``EnvSubstitutionError`` is gone from ``opentelemetry.configuration.file``,
  because nothing raises it any more.
  Three fields of a configuration file that the previous release parsed and
  then ignored now take effect, so a file nobody has edited can change what the
  process exports.
  A top-level ``attribute_limits`` block applies to spans and to log records
  wherever the signal declares no ``limits`` of its own. A file carrying
  ``attribute_count_limit: 2`` used to leave the SDK defaults of 128 attributes
  and no length limit in place, and now drops every attribute past the second.
  Metrics are unaffected.
  A top-level ``log_level`` is applied to the ``opentelemetry`` logger, so
  ``log_level: error`` now silences the exporter's warnings about failed
  exports.
  A key written with an empty value is read as an empty object rather than as
  absent, which the specification requires: ``always_on:`` means
  ``always_on: {}``. A detector, sampler or exporter written that way used to be
  skipped and now runs, so a ``detection/development`` list containing
  ``- host:`` and ``- process:`` starts adding the twelve ``host.*`` and
  ``process.*`` attributes those detectors produce, among them
  ``process.command`` and ``process.owner``.

