# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'.
change_type: bug_fix

# A single word describing the area of concern (e.g. distro, pyproto, exporter,
# resource-detectors, deps, ci, release, docs).
component: distro

# A brief description of the change. Surround your text with quotes ("") if it
# needs to start with a backtick (`).
note: Compare distribution names in their PEP 503 canonical form in the double-instrumentation check

# One or more tracking issues related to the change. At least one is required.
issues: [64]

# (Optional) One or more lines of additional information to render under the
# primary note. These lines are padded with 2 spaces and inserted directly into
# the document. Use pipe (|) for multiline entries.
subtext: |
  The check lowercased names but did not apply the rest of the PEP 503 rule,
  under which runs of ``-``, ``_`` and ``.`` all collapse to a single ``-``.
  Distributions report the name they declared, verbatim, and non-canonical
  spellings are ordinary, so an application shipping ``OpenTelemetry_SDK`` was
  not recognised as shipping ``opentelemetry-sdk``. The distribution then
  activated on top of an already instrumented application, which is exactly
  what the check exists to prevent. The same normalisation now applies to the
  excluded API-layer packages, so an application declaring
  ``opentelemetry_api`` is still correctly exempt.

change_logs: [user]
