# Keeps the curated instrumentation pin set (and everything else in the uv
# workspace) moving with upstream releases. The opentelemetry-* packages are
# grouped into a single PR because the contrib instrumentations only resolve
# when they all sit on the same contrib version as opentelemetry-instrumentation;
# tests/test_instrumentations.py then flags instrumentations that upstream
# added or removed in the new version.
version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry-*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
