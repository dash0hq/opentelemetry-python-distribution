name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Ruff lint
        run: uvx ruff@latest check packages/dash0-opentelemetry-distro examples scripts
      - name: Ruff format check
        run: uvx ruff@latest format --check packages/dash0-opentelemetry-distro examples scripts
      - name: Check uv.lock is up to date
        run: uv lock --check
      - name: Check exact dependency pins
        run: uv run --no-project --python 3.13 scripts/check_pinned_dependencies.py
      - name: Check changed packages bumped their released versions
        run: uv run --no-project --python 3.13 scripts/check_version_bumped.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Run distribution unit tests
        run: >
          uv run --package dash0-opentelemetry-distro
          --python ${{ matrix.python-version }}
          python -m pytest packages/dash0-opentelemetry-distro/tests -v

  sitecustomize-python27:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check sitecustomize.py parses and self-deactivates on Python 2.7
        run: python3 scripts/check_sitecustomize_python27.py

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Validate changelog entries
        run: make chlog-validate

  scripts-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Run repo script tests
        run: >
          uv run --no-project --with pytest --python 3.13
          python -m pytest scripts/tests -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build every workspace package (packaging smoke test)
        run: |
          set -euo pipefail
          uv build --all-packages --out-dir dist \
            --build-constraints scripts/build-constraints.txt
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
