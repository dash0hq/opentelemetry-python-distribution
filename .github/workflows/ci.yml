name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Ruff lint
        run: uvx ruff@latest check packages/dash0-opentelemetry examples scripts
      - name: Ruff format check
        run: uvx ruff@latest format --check packages/dash0-opentelemetry examples scripts
      - name: Check uv.lock is up to date
        run: uv lock --check
      - name: Check exact dependency pins
        run: uv run --no-project --python 3.13 scripts/check_pinned_dependencies.py
      - name: Check changed packages bumped their released versions
        run: uv run --no-project --python 3.13 scripts/check_version_bumped.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Run distribution unit tests
        run: >
          uv run --package dash0-opentelemetry
          --python ${{ matrix.python-version }}
          python -m pytest packages/dash0-opentelemetry/tests -v

  sitecustomize-python27:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The script runs sitecustomize.py under real Python 2.7: it stages it alone in a
      # directory, as consumers deploy it, and starts python:2.7.18 docker containers that
      # byte-compile it and run a Python 2.7 process with the directory on the PYTHONPATH.
      # python3 only orchestrates docker and asserts the warn-and-continue behavior.
      - name: Check sitecustomize.py parses and self-deactivates on Python 2.7
        run: python3 scripts/check_sitecustomize_python27.py

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a changelog entry
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'Skip Changelog') }}
        run: |
          set -euo pipefail
          skip_re='^(chore|docs)(\([^)]*\))?:'
          if [[ "$PR_TITLE" =~ $skip_re ]] || [[ "$SKIP_LABEL" == "true" ]]; then
            echo "Skipping changelog requirement (chore/docs PR or 'Skip Changelog' label)."
            exit 0
          fi
          entries=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD \
            -- '.chloggen/*.yaml' | grep -v 'TEMPLATE.yaml' || true)
          if [ -z "$entries" ]; then
            echo "::error::No .chloggen entry found for this PR."
            echo "::error::Add one with 'make chlog-new', or prefix the PR title"
            echo "::error::with 'chore:' / 'docs:' (with optional scope) or add the"
            echo "::error::'Skip Changelog' label to opt out."
            exit 1
          fi
          echo "Found: $entries"
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Validate changelog entries
        run: make chlog-validate

  scripts-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Run repo script tests
        run: >
          uv run --no-project --with pytest --python 3.13
          python -m pytest scripts/tests -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build every workspace package (packaging smoke test)
        run: |
          set -euo pipefail
          uv build --all-packages --out-dir dist \
            --build-constraints scripts/build-constraints.txt
          ls -l dist
      - name: Validate package metadata
        run: |
          set -euo pipefail
          # Mirrors release.yml so a long_description that would fail
          # `twine check --strict` at publish time is caught here, on every PR,
          # instead of only when the release build runs.
          uv run --no-project --with twine==6.2.0 --python 3.13 \
            python -m twine check --strict dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
