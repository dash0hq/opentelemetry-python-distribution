name: Automation - Create Tag for Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  create-tag-for-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          # We deliberately avoid secrets.GITHUB_TOKEN: events triggered by that
          # token do not fire subsequent workflows, so the tag push would not
          # trigger release.yml. See
          # https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/triggering-a-workflow#triggering-a-workflow-from-a-workflow
          token: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}

      - name: Create tag for release
        run: .github/workflows/scripts/create-tag-for-release.sh
