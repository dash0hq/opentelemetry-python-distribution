name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          New distro version (e.g. 0.3.0, 0.3.0rc1). Vendored packages that
          changed since the last release tag are bumped automatically to their
          next .postN version.
        required: true
      date:
        description: "Release date for the changelog heading (YYYY-MM-DD, defaults to today)"
        required: false
        default: ""

permissions: {}

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -euo pipefail {0}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # Use the maintainer PAT so the resulting push fires
          # create-tag-for-release.yml (GITHUB_TOKEN pushes are suppressed).
          token: ${{ secrets.REPOSITORY_FULL_ACCESS_GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.30"
          enable-cache: false

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Bump versions
        run: python3 scripts/bump_for_release.py "${{ inputs.version }}"

      - name: Update changelog
        run: |
          DATE="${{ inputs.date }}"
          [ -z "$DATE" ] && DATE=$(date +%Y-%m-%d)
          make chlog-update VERSION="${{ inputs.version }} - $DATE"

      - name: Relock
        run: uv lock

      - name: Commit and push
        run: |
          git config user.name d0etu
          git config user.email d0etu@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "::error::Nothing to commit — version may already be set or changelog entries missing"
            exit 1
          fi
          git commit -m "docs: update changelog to prepare release v${{ inputs.version }}"
          git push origin main
