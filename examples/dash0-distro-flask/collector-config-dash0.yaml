# Collector config that writes telemetry to local JSONL files (for debugging)
# AND forwards it to Dash0. Selected by docker-compose.dash0.yml.
#
# Requires these environment variables on the collector container (supplied by
# docker-compose.dash0.yml from your shell):
#   DASH0_ENDPOINT    - your org's OTLP/HTTP ingress URL, copied verbatim from
#                       Dash0 -> Settings -> Endpoints -> OTLP via HTTP, e.g.
#                       https://ingress.europe-west4.gcp.dash0.com
#   DASH0_AUTH_TOKEN  - a Dash0 auth token (Settings -> Auth Tokens); starts auth_
#   DASH0_DATASET     - the dataset name to route into (e.g. default)

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  file/traces:
    path: /output/traces.jsonl
  file/metrics:
    path: /output/metrics.jsonl
  file/logs:
    path: /output/logs.jsonl
  otlphttp/dash0:
    endpoint: ${env:DASH0_ENDPOINT}
    headers:
      Authorization: "Bearer ${env:DASH0_AUTH_TOKEN}"
      Dash0-Dataset: "${env:DASH0_DATASET}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/traces, otlphttp/dash0]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/metrics, otlphttp/dash0]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/logs, otlphttp/dash0]
