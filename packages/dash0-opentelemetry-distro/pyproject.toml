[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dash0-opentelemetry-distro"
dynamic = ["version"]
description = "Dash0 OpenTelemetry distribution for Python"
readme = "README.rst"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Dash0" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# The distribution ships a curated, exactly-pinned set of upstream packages:
# every release is validated against precisely these versions, and the code
# assumes them. Bump them together, deliberately, in a dedicated change.
dependencies = [
  "opentelemetry-api == 1.43.0",
  "opentelemetry-sdk == 1.43.0",
  "opentelemetry-instrumentation == 0.64b0",
  # Pure-Python OTLP exporters (no native dependencies), vendored in this
  # workspace from open-telemetry/opentelemetry-packaging. Not yet published,
  # so these dependencies are not resolvable from PyPI until they are released
  # or vendored into the injected tree.
  "opentelemetry-exporter-otlp-pyproto-http",
  "opentelemetry-exporter-otlp-pyproto-grpc",
]

[project.entry-points.opentelemetry_distro]
dash0 = "dash0.opentelemetry.distro:Dash0Distro"

[project.entry-points.opentelemetry_configurator]
dash0 = "dash0.opentelemetry.configurator:Dash0Configurator"

[project.entry-points.opentelemetry_resource_detector]
dash0_distribution = "dash0.opentelemetry.resource:Dash0DistributionResourceDetector"
dash0_kubernetes = "dash0.opentelemetry.resource:Dash0KubernetesResourceDetector"
dash0_service_name = "dash0.opentelemetry.resource:Dash0ServiceNameResourceDetector"

[dependency-groups]
dev = [
  "pytest >= 7.0",
  # Exercises the declarative-configuration (OTEL_CONFIG_FILE) code paths in
  # the unit tests. On SDK 1.43 the declarative machinery ships inside the SDK
  # behind this extra; whether it becomes a runtime dependency of the distro is
  # tracked in issue #5.
  "opentelemetry-sdk[file-configuration]",
]

[tool.hatch.version]
path = "src/dash0/opentelemetry/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dash0"]
