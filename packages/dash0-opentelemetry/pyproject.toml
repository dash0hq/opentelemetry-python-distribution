[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dash0-opentelemetry"
dynamic = ["version"]
description = "Dash0 OpenTelemetry distribution for Python"
readme = "README.rst"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Dash0" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# The distribution ships a curated, exactly-pinned set of upstream packages:
# every release is validated against precisely these versions, and the code
# assumes them. Bump them together, deliberately, in a dedicated change.
dependencies = [
  # --- OpenTelemetry packages ---
  "opentelemetry-api == 1.44.0",
  "opentelemetry-sdk == 1.44.0",
  "opentelemetry-instrumentation == 0.65b0",
  "opentelemetry-semantic-conventions == 0.65b0",
  # Pure-Python OTLP exporters (no native dependencies), vendored in this
  # workspace from open-telemetry/opentelemetry-packaging under Dash0-owned
  # distribution names (import paths and entry points stay upstream-shaped).
  # Published on both the Dash0 package index and public PyPI.
  "dash0-opentelemetry-exporter-otlp-pyproto-http == 1.44.0",
  "dash0-opentelemetry-exporter-otlp-pyproto-grpc == 1.44.0",

  # --- Curated instrumentation set ---
  # The full upstream auto-instrumentation list (the bootstrap_gen module of
  # opentelemetry-instrumentation), shipped as regular dependencies so injected
  # processes need no `opentelemetry-bootstrap` step. Instrumentations only
  # activate when their target library is present, so carrying all of them is
  # safe. tests/test_instrumentations.py fails when this block drifts from the
  # upstream list of the pinned opentelemetry-instrumentation release.
  # Deliberately not shipped: opentelemetry-exporter-prometheus,
  # opentelemetry-propagator-ot-trace, and
  # opentelemetry-instrumentation-aws-lambda.
  "opentelemetry-instrumentation-aio-pika == 0.65b0",
  "opentelemetry-instrumentation-aiohttp-client == 0.65b0",
  "opentelemetry-instrumentation-aiohttp-server == 0.65b0",
  "opentelemetry-instrumentation-aiokafka == 0.65b0",
  "opentelemetry-instrumentation-aiopg == 0.65b0",
  "opentelemetry-instrumentation-asgi == 0.65b0",
  "opentelemetry-instrumentation-asyncclick == 0.65b0",
  "opentelemetry-instrumentation-asyncio == 0.65b0",
  "opentelemetry-instrumentation-asyncpg == 0.65b0",
  "opentelemetry-instrumentation-boto3sqs == 0.65b0",
  "opentelemetry-instrumentation-botocore == 0.65b0",
  "opentelemetry-instrumentation-cassandra == 0.65b0",
  "opentelemetry-instrumentation-celery == 0.65b0",
  "opentelemetry-instrumentation-click == 0.65b0",
  "opentelemetry-instrumentation-confluent-kafka == 0.65b0",
  "opentelemetry-instrumentation-dbapi == 0.65b0",
  "opentelemetry-instrumentation-django == 0.65b0",
  "opentelemetry-instrumentation-exceptions == 0.65b0",
  "opentelemetry-instrumentation-falcon == 0.65b0",
  "opentelemetry-instrumentation-fastapi == 0.65b0",
  "opentelemetry-instrumentation-flask == 0.65b0",
  "opentelemetry-instrumentation-grpc == 0.65b0",
  "opentelemetry-instrumentation-httpx == 0.65b0",
  "opentelemetry-instrumentation-jinja2 == 0.65b0",
  "opentelemetry-instrumentation-kafka-python == 0.65b0",
  "opentelemetry-instrumentation-logging == 0.65b0",
  "opentelemetry-instrumentation-mysql == 0.65b0",
  "opentelemetry-instrumentation-mysqlclient == 0.65b0",
  "opentelemetry-instrumentation-pika == 0.65b0",
  "opentelemetry-instrumentation-psycopg == 0.65b0",
  "opentelemetry-instrumentation-psycopg2 == 0.65b0",
  "opentelemetry-instrumentation-pymemcache == 0.65b0",
  "opentelemetry-instrumentation-pymongo == 0.65b0",
  "opentelemetry-instrumentation-pymssql == 0.65b0",
  "opentelemetry-instrumentation-pymysql == 0.65b0",
  "opentelemetry-instrumentation-pyramid == 0.65b0",
  "opentelemetry-instrumentation-redis == 0.65b0",
  "opentelemetry-instrumentation-remoulade == 0.65b0",
  "opentelemetry-instrumentation-requests == 0.65b0",
  "opentelemetry-instrumentation-sqlalchemy == 0.65b0",
  "opentelemetry-instrumentation-sqlite3 == 0.65b0",
  "opentelemetry-instrumentation-starlette == 0.65b0",
  "opentelemetry-instrumentation-structlog == 0.65b0",
  "opentelemetry-instrumentation-system-metrics == 0.65b0",
  "opentelemetry-instrumentation-threading == 0.65b0",
  "opentelemetry-instrumentation-tornado == 0.65b0",
  "opentelemetry-instrumentation-tortoiseorm == 0.65b0",
  "opentelemetry-instrumentation-urllib == 0.65b0",
  "opentelemetry-instrumentation-urllib3 == 0.65b0",
  "opentelemetry-instrumentation-wsgi == 0.65b0",
  # GenAI instrumentations release on their own version train, not the contrib
  # one. The 2.x line of -vertexai is upstream contrib's; the 0.x line under the
  # same PyPI name belongs to Traceloop's openllmetry — never pin below 2.0b0.
  # openai-v2 is held at 2.3b0: 2.4b0 requires opentelemetry-util-genai >= 0.4b0
  # while vertexai 2.2b0 requires < 0.3b0.
  "opentelemetry-instrumentation-openai-v2 == 2.3b0",
  "opentelemetry-instrumentation-vertexai == 2.2b0",
  "opentelemetry-util-genai == 0.2b0",
  "opentelemetry-util-http == 0.65b0",
  # Shipped on top of the upstream auto-instrumentation list, which only
  # covers instrumentations: the X-Ray propagator was always part of the Dash0
  # operator's instrumentation image.
  "opentelemetry-propagator-aws-xray == 1.0.2",

  # --- Non-OpenTelemetry packages ---
  # The support libraries the OpenTelemetry packages above pull in
  # transitively, declared here with an exact pin so the full injected tree is
  # spelled out in this file and no version is left to transitive resolution.
  # scripts/check_pinned_dependencies.py fails the build when the declared set
  # drifts from the resolved closure.
  "asgiref == 3.12.1",
  "packaging == 26.2",
  "psutil == 7.2.2",
  "typing-extensions == 4.16.0",
  "wrapt == 1.17.3",
]

[project.entry-points.opentelemetry_distro]
dash0 = "dash0.opentelemetry.distro:Dash0Distro"

[project.entry-points.opentelemetry_configurator]
dash0 = "dash0.opentelemetry.configurator:Dash0Configurator"

[project.entry-points.opentelemetry_resource_detector]
dash0_distribution = "dash0.opentelemetry.resource:Dash0DistributionResourceDetector"
dash0_kubernetes = "dash0.opentelemetry.resource:Dash0KubernetesResourceDetector"
dash0_service_name = "dash0.opentelemetry.resource:Dash0ServiceNameResourceDetector"

[dependency-groups]
dev = [
  "pytest >= 7.0",
]

[tool.hatch.version]
path = "src/dash0/opentelemetry/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dash0"]
