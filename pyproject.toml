# Virtual workspace root for the Dash0 OpenTelemetry Python distribution.
#
# The Dash0 distribution and the pure-Python (pyproto) OTLP exporter packages it
# depends on live together as workspace members so the distribution resolves the
# in-repo exporters instead of published ones. api/sdk/instrumentation still come
# from PyPI.

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
dash0-opentelemetry-distro = { workspace = true }
opentelemetry-pyproto = { workspace = true }
opentelemetry-exporter-otlp-pyproto-common = { workspace = true }
opentelemetry-exporter-otlp-pyproto-http = { workspace = true }
opentelemetry-exporter-otlp-pyproto-grpc = { workspace = true }
