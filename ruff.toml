# Lint/format config for the Dash0-authored code. The vendored pyproto packages
# are kept as-is from upstream and excluded from our style enforcement.

line-length = 88
target-version = "py310"

extend-exclude = [
  "packages/opentelemetry-pyproto",
  "packages/opentelemetry-exporter-otlp-pyproto-common",
  "packages/opentelemetry-exporter-otlp-pyproto-http",
  "packages/opentelemetry-exporter-otlp-pyproto-grpc",
  "**/*_pb2*.py",
  "**/*_pypb2*.py",
  # The bootstrap sitecustomize script must stay valid Python 2.7+ so it can
  # detect and bail out gracefully on legacy interpreters. Excluded because the
  # pyupgrade (UP) rules would rewrite its 2.7-compatible constructs
  # (`from __future__`, `.format()`) into 3.x-only syntax.
  "bootstrap",
]

[lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
]
