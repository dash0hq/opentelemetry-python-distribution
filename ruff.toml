# Lint/format config for the Dash0-authored code. The vendored pyproto packages
# are kept as-is from upstream and excluded from our style enforcement.

line-length = 88
target-version = "py310"

extend-exclude = [
  # The injector bootstrap script must stay valid Python 2.7+ (it runs, and
  # gracefully self-deactivates, on any interpreter the injector touches), so
  # the py310 style rules cannot apply to it.
  "packages/dash0-opentelemetry/src/dash0/opentelemetry/injector/sitecustomize.py",
  # Vendored verbatim from opentelemetry.instrumentation._packaging (kept
  # upstream-shaped so it can be dropped once that ships in a pinned release),
  # together with its upstream tests.
  "packages/dash0-opentelemetry/src/dash0/opentelemetry/injector/_packaging",
  "packages/dash0-opentelemetry/tests/test_packaging_*.py",
  "packages/dash0-opentelemetry-pyproto",
  "packages/dash0-opentelemetry-exporter-otlp-pyproto-common",
  "packages/dash0-opentelemetry-exporter-otlp-pyproto-http",
  "packages/dash0-opentelemetry-exporter-otlp-pyproto-grpc",
  "**/*_pb2*.py",
  "**/*_pypb2*.py",
]

[lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
]
