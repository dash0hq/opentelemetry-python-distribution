apiVersion: v1
kind: Service
metadata:
  name: collector
  namespace: dash0-e2e
spec:
  selector:
    app: collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: dash0-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.163.2
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
            - name: output
              mountPath: /output
          readinessProbe:
            tcpSocket:
              port: 4318
            initialDelaySeconds: 2
            periodSeconds: 2
        - name: reader
          image: busybox:1.38
          command: ["sh", "-c", "sleep infinity"]
          volumeMounts:
            - name: output
              mountPath: /output
      volumes:
        - name: config
          configMap:
            name: collector-config
        - name: output
          emptyDir: {}
