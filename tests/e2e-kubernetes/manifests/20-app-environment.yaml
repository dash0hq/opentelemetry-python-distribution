apiVersion: v1
kind: Service
metadata:
  name: app-environment
  namespace: dash0-e2e
spec:
  selector:
    app: app-environment
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-environment
  namespace: dash0-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-environment
  template:
    metadata:
      labels:
        app: app-environment
    spec:
      initContainers:
        - name: copy-instrumentation
          image: dash0-e2e-instrumentation:test
          imagePullPolicy: Never
          command: ["sh", "-c", "cp -a /dash0/. /instrumentation/"]
          volumeMounts:
            - name: instrumentation
              mountPath: /instrumentation
      containers:
        - name: app
          image: dash0-e2e-app:test
          imagePullPolicy: Never
          env:
            - name: PYTHONPATH
              value: /instrumentation
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://collector.dash0-e2e.svc.cluster.local:4318
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "2000"
            - name: OTEL_BSP_SCHEDULE_DELAY
              value: "500"
            - name: OTEL_INJECTOR_LOG_LEVEL
              value: debug
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: instrumentation
              mountPath: /instrumentation
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 2
      volumes:
        - name: instrumentation
          emptyDir: {}
