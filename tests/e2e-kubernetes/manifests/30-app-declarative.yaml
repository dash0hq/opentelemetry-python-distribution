apiVersion: v1
kind: ConfigMap
metadata:
  name: declarative-config
  namespace: dash0-e2e
data:
  otel-config.yaml: |
    file_format: "1.0"
    propagator:
      composite:
        - tracecontext: {}
        - baggage: {}
    resource:
      detection/development:
        detectors:
          - dash0_distribution: {}
          - dash0_kubernetes: {}
          - dash0_service_name: {}
    tracer_provider:
      processors:
        - batch:
            schedule_delay: 500
            exporter:
              otlp_http:
                endpoint: http://collector.dash0-e2e.svc.cluster.local:4318/v1/traces
---
apiVersion: v1
kind: Service
metadata:
  name: app-declarative
  namespace: dash0-e2e
spec:
  selector:
    app: app-declarative
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-declarative
  namespace: dash0-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-declarative
  template:
    metadata:
      labels:
        app: app-declarative
    spec:
      initContainers:
        - name: copy-instrumentation
          image: dash0-e2e-instrumentation:test
          imagePullPolicy: Never
          command: ["sh", "-c", "cp -a /dash0/. /instrumentation/"]
          volumeMounts:
            - name: instrumentation
              mountPath: /instrumentation
      containers:
        - name: app
          image: dash0-e2e-app:test
          imagePullPolicy: Never
          env:
            - name: PYTHONPATH
              value: /instrumentation
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://collector.dash0-e2e.svc.cluster.local:4318
            - name: OTEL_CONFIG_FILE
              value: /etc/dash0/otel-config.yaml
            - name: OTEL_INJECTOR_LOG_LEVEL
              value: debug
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: instrumentation
              mountPath: /instrumentation
            - name: declarative-config
              mountPath: /etc/dash0
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 2
      volumes:
        - name: instrumentation
          emptyDir: {}
        - name: declarative-config
          configMap:
            name: declarative-config
